# .pre-commit-config.yaml — checks automáticos antes de cada commit
#
# Este fichero va en la RAÍZ de tu proyecto.
#
# Resuelve un problema concreto: el CI solo se entera de los problemas
# cuando ya hiciste el commit y el push. Si hay un error de lint o un
# secreto filtrado, te enteras minutos después, corriges, otro commit,
# otro push, y esperas de nuevo.
#
# Pre-commit ejecuta los mismos checks ANTES de que el commit se complete,
# en tu propia máquina. Si algo falla, el commit se cancela y te muestra
# qué corregir. Cero commits rotos llegan al CI.
#
# ── INSTALACIÓN ───────────────────────────────────────────────────────────
#
#   pip install pre-commit
#   pre-commit install                # registra el hook en .git/hooks/
#   pre-commit run --all-files        # opcional: ejecutar sobre todo el
#                                     # código existente la primera vez
#
# A partir de ahí es automático en cada `git commit`.
#
# ── CÓMO FUNCIONA ─────────────────────────────────────────────────────────
#
# Pre-commit es un gestor de hooks de git. Al instalar, registra un script
# en .git/hooks/pre-commit. Cada vez que haces `git commit`, git llama
# a ese script antes de completar el commit.
#
# No necesitas tener las herramientas instaladas globalmente — pre-commit
# gestiona sus propios entornos virtuales aislados para cada hook.
#
# ── POR QUÉ SOLO RUFF Y NO BLACK + ISORT TAMBIÉN ─────────────────────────
#
# En el CI (ci-python.yml) sí tenemos Black e isort como pasos separados
# porque queremos saber exactamente qué falló en el PR.
#
# Aquí en el pre-commit el objetivo es distinto: corregir automáticamente
# antes del commit, no reportar. Ruff con --fix ya cubre lint + imports
# (regla "I" del ruff.toml) y ruff-format cubre el formato equivalente
# a Black. Añadir Black e isort encima sería redundante — tres herramientas
# modificando los mismos ficheros en orden, con riesgo de conflictos.


repos:

  # ════════════════════════════════════════════════════════════════════════
  # CHECKS GENÉRICOS
  # Una colección de checks simples pero muy útiles para cualquier proyecto
  # independientemente del lenguaje o framework.
  # ════════════════════════════════════════════════════════════════════════
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # Elimina espacios al final de las líneas. Parece trivial pero
      # genera diffs ruidosos en PRs cuando diferentes editores los
      # añaden o eliminan sin querer.
      - id: trailing-whitespace

      # Garantiza que todos los ficheros terminen con una línea en blanco.
      # Es el estándar POSIX y evita warnings en muchas herramientas.
      - id: end-of-file-fixer

      # Validan que los ficheros de configuración tengan sintaxis válida.
      # Evita pushear un ci-python.yml roto que GitHub Actions ni siquiera
      # puede parsear, o un pyproject.toml con un error que rompe todo.
      - id: check-yaml
      - id: check-toml
      - id: check-json

      # Detecta marcadores de conflicto de git sin resolver:
      # <<<<<<, =======, >>>>>>>
      # Evita commitear código con conflictos accidentalmente.
      - id: check-merge-conflict

      # Bloquea ficheros mayores de 500KB. Evita que alguien añada
      # por error una imagen, un dataset o un binario al repo.
      # Los repos de código no deberían tener ficheros grandes.
      - id: check-added-large-files
        args: ["--maxkb=500"]

      # Busca patrones de claves privadas RSA, SSH, etc.
      # Es una capa de detección rápida antes de TruffleHog (que va
      # en el CI y es más exhaustivo).
      - id: detect-private-key

      # Bloquea commits directos a main. Obliga a trabajar siempre
      # en ramas y hacer PRs, que es exactamente el flujo que
      # configuramos en el CI.
      - id: no-commit-to-branch
        args: ["--branch", "main"]


  # ════════════════════════════════════════════════════════════════════════
  # RUFF — linting, imports y formato
  #
  # Dos hooks que cubren todo:
  #
  #   ruff         → lint + corrige automáticamente lo que puede
  #                  (imports desordenados, errores simples, etc.)
  #                  Lee las reglas de ruff.toml en la raíz del proyecto.
  #
  #   ruff-format  → formato del código (equivalente a Black).
  #                  Lee la sección [format] de ruff.toml.
  #
  # Si alguno modifica ficheros, el commit se cancela. Haces `git add`
  # de los ficheros modificados y repites el commit — a la segunda pasa
  # porque ya están corregidos.
  # ════════════════════════════════════════════════════════════════════════
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format


  # ════════════════════════════════════════════════════════════════════════
  # BANDIT — seguridad en código fuente
  # Corre el análisis de seguridad antes del commit para dar feedback
  # inmediato. El job de security del CI es más exhaustivo, pero tener
  # bandit aquí evita llegar al CI con problemas obvios.
  # Excluye tests/ porque los patrones peligrosos son aceptables ahí.
  # ════════════════════════════════════════════════════════════════════════
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        exclude: tests/


  # ════════════════════════════════════════════════════════════════════════
  # DETECT-SECRETS — detección de secretos filtrados
  #
  # Diferente a TruffleHog (que va en el CI):
  #   TruffleHog     → verifica contra servicios reales si la clave funciona
  #   detect-secrets → mantiene un baseline de falsos positivos conocidos
  #
  # La primera vez genera el baseline con todos los "secretos" que ya
  # existen y son falsos positivos (URLs con tokens de ejemplo, etc.):
  #
  #   detect-secrets scan > .secrets.baseline
  #
  # A partir de ahí solo alerta de secretos NUEVOS que no estaban
  # en el baseline. Commitea el .secrets.baseline al repo.
  # ════════════════════════════════════════════════════════════════════════
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
